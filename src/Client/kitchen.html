<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình Bếp (Kitchen Display System) - Đề tài 04</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        .kds-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 1rem;
        }
        @media (max-width: 900px) {
            .kds-board {
                grid-template-columns: 1fr;
            }
        }
        .kds-column {
            background: #e2e8f0;
            border-radius: 10px;
            padding: 1rem;
            min-height: 500px;
        }
        .kds-column-header {
            font-size: 1.1rem;
            font-weight: 700;
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 5px solid #94a3b8;
        }
        .order-card.pending { border-left-color: #f59e0b; }
        .order-card.preparing { border-left-color: #0284c7; }
        .order-card.ready { border-left-color: #10b981; }
        .order-card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .order-card-items {
            font-size: 0.85rem;
            background: #f8fafc;
            border-radius: 6px;
            padding: 0.5rem;
            margin: 0.5rem 0;
        }
        .order-card-items div {
            margin-bottom: 0.3rem;
        }
        .order-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>👨‍🍳 Màn Hình Bếp (Kitchen Display System)</h1>
        <div class="nav-links">
            <a href="index.html">🍽️ Khách hàng đặt món</a>
            <a href="kitchen.html" class="active">👨‍🍳 Màn hình Bếp (KDS)</a>
        </div>
    </header>

    <div class="container" style="max-width: 1400px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <div>
                <h2>Hàng Đợi Chế Biến Món Ăn</h2>
                <p style="font-size: 0.85rem; color: #64748b;">Dữ liệu đồng bộ thời gian thực qua RabbitMQ và SignalR</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="realtime-status-dot" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #10b981;"></span>
                <span id="realtime-status-text" style="font-size: 0.85rem; color: #10b981; font-weight: 600;">Realtime Connected</span>
                <button class="btn btn-outline" onclick="loadOrders()" style="margin-left: 10px;">🔄 Làm mới</button>
            </div>
        </div>

        <div class="kds-board">
            <!-- Cột 1: Đang chờ (Pending) -->
            <div class="kds-column">
                <div class="kds-column-header">
                    <span>⏳ 1. ĐƠN CHỜ TIẾP NHẬN</span>
                    <span id="count-pending" class="badge badge-pending">0</span>
                </div>
                <div id="column-pending"></div>
            </div>

            <!-- Cột 2: Đang nấu (Preparing) -->
            <div class="kds-column">
                <div class="kds-column-header">
                    <span>🔥 2. ĐANG CHẾ BIẾN</span>
                    <span id="count-preparing" class="badge badge-preparing">0</span>
                </div>
                <div id="column-preparing"></div>
            </div>

            <!-- Cột 3: Đã nấu xong (Ready) -->
            <div class="kds-column">
                <div class="kds-column-header">
                    <span>✅ 3. ĐÃ NẤU XONG</span>
                    <span id="count-ready" class="badge badge-ready">0</span>
                </div>
                <div id="column-ready"></div>
            </div>
        </div>
    </div>

    <script src="js/kitchen.js"></script>
</body>
</html>
